<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualización de Sombreado</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      z-index: 1;
    }
  </style>
</head>
<body>
<div id="info">Sombreado: Flat (Izquierda) vs Phong (Derecha)</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 6;

  const renderer = new THREE.WebGLRenderer({antialias: true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Luz puntual animada
  const light = new THREE.PointLight(0xffffff, 1);
  scene.add(light);

  const lightHelper = new THREE.PointLightHelper(light, 0.2);
  scene.add(lightHelper);

  // Material Flat Shading
  const flatMaterial = new THREE.MeshPhongMaterial({ 
    color: 0xff3333,
    flatShading: true,
    shininess: 0
  });

  // Material Phong Shading (suavizado)
  const phongMaterial = new THREE.MeshPhongMaterial({ 
    color: 0x3333ff,
    shininess: 100
  });

  // Geometría con poca resolución para resaltar el sombreado
  const geometry = new THREE.SphereGeometry(1, 10, 10);

  // Esferas
  const flatSphere = new THREE.Mesh(geometry, flatMaterial);
  flatSphere.position.x = -2.5;
  scene.add(flatSphere);

  const phongSphere = new THREE.Mesh(geometry, phongMaterial);
  phongSphere.position.x = 2.5;
  scene.add(phongSphere);

  // Animación
  let angle = 0;
  function animate() {
    requestAnimationFrame(animate);

    angle += 0.01;
    const radius = 5;
    light.position.set(Math.sin(angle) * radius, 2, Math.cos(angle) * radius);

    flatSphere.rotation.y += 0.01;
    phongSphere.rotation.y += 0.01;

    renderer.render(scene, camera);
  }

  animate();

  // Redimensionar
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
