<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Modelos Básicos de Iluminación</title>
  <style>
    body { margin: 0; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
  <script>
    // Escena
    const escena = new THREE.Scene();

    // Cámara
    const camara = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camara.position.z = 3;

    // Renderizador
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Geometría y material
    const geometria = new THREE.SphereGeometry(1, 32, 32);
    const material = new THREE.MeshPhongMaterial({
      color: 0x0077ff,
      shininess: 50,           // Aumenta el brillo especular
      specular: 0xffffff       // Color del brillo especular
    });

    const esfera = new THREE.Mesh(geometria, material);
    escena.add(esfera);

    // Luz ambiente (iluminación constante)
    const luzAmbiente = new THREE.AmbientLight(0x404040); // Luz suave general
    escena.add(luzAmbiente);

    // Luz direccional (difusa y especular)
    const luzDireccional = new THREE.DirectionalLight(0xffffff, 1);
    luzDireccional.position.set(3, 3, 3);
    escena.add(luzDireccional);

    // Animación
    function animar() {
      requestAnimationFrame(animar);
      esfera.rotation.y += 0.01;
      renderer.render(escena, camara);
    }

    animar();
  </script>
</body>
</html>
